name: Website Change Monitor

on:
  schedule:
    - cron: "0 */6 * * *" # Every 6 hours
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate required secrets
        env:
          SCRNPIX_API_KEY: ${{ secrets.SCRNPIX_API_KEY }}
          MONITOR_CONFIG_YML: ${{ secrets.MONITOR_CONFIG_YML }}
        run: |
          [ -n "$SCRNPIX_API_KEY" ] || { echo "::error::Missing SCRNPIX_API_KEY"; exit 1; }
          [ -n "$MONITOR_CONFIG_YML" ] || { echo "::error::Missing MONITOR_CONFIG_YML"; exit 1; }

      - name: Write monitor config
        env:
          MONITOR_CONFIG_YML: ${{ secrets.MONITOR_CONFIG_YML }}
        run: printf "%s\n" "$MONITOR_CONFIG_YML" > monitor.config.yml

      - name: Restore snapshots cache
        uses: actions/cache@v4
        with:
          path: ./snapshots
          key: snapshots-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            snapshots-${{ github.ref_name }}-

      - name: Run monitor
        env:
          SCRNPIX_API_KEY: ${{ secrets.SCRNPIX_API_KEY }}
        run: npm run monitor -- --config monitor.config.yml

      - name: Upload diff artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-diffs
          path: ./snapshots/**/diff.png
          retention-days: 30
          if-no-files-found: ignore
